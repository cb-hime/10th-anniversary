<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Birthday AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="startScreen" class="overlay">
    <div class="card">
      <h1>SECRET MESSAGE</h1>
      <p>STARTを押してカメラを許可してください。<br>そのあとTシャツのデザインにカメラを向けてください。</p>
      <button id="startButton">START</button>
    </div>
  </div>

  <div id="scanGuide" class="scan-guide hidden">
    Tシャツのデザインにカメラを向けてください
  </div>

  <div id="videoOverlay" class="video-overlay hidden">
    <video id="birthdayVideo" playsinline webkit-playsinline preload="auto">
      <source src="./movie.mp4" type="video/mp4" />
    </video>
    <button id="closeVideo" aria-label="動画を閉じる">×</button>
  </div>

  <div id="errorMessage" class="error hidden"></div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="imageTarget" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script src="./script.js"></script>
</body>
</html>
